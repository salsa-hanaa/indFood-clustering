[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "indfood-clustering"
version = "0.1.0"
description = "Unsupervised visual clustering citra makanan Nusantara berbasis DINO, UMAP, dan K-Means"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["clustering", "dino", "umap", "k-means", "computer-vision", "food"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    # Backbone & ekstraksi fitur
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.44",
    "huggingface-hub>=0.23",
    "timm>=1.0.9",
    # Data & citra
    "numpy>=1.26",
    "pandas>=2.0",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "scipy>=1.11",
    # Visualisasi
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Clustering & reduksi dimensi
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "optuna>=4.0",
    # Interaktif (cluster browser di notebook)
    "ipywidgets>=8.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0",
    "notebook>=7.0",
    "ipykernel>=6.0",
]
dev = [
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://www.kaggle.com/competitions/data-mining-action-2025"

# Catatan instalasi GPU:
# - Torch dengan dukungan CUDA diinstal dari wheel default PyPI (>=2.8 sudah
#   membundel CUDA). Untuk CUDA 12.6/12.8 gunakan contoh berikut bila perlu:
#     uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
# - Unduh bobot DINOv3 (repo gated facebook/dinov3-*) memerlukan HF_TOKEN,
#   lihat .env. Token TIDAK boleh di-commit.

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.setuptools]
# Proyek ini notebook-only (final_project_kcv_2026.ipynb), belum ada paket
# Python di src/. Blok ini menjaga `pip install .` tetap membangun wheel
# metadata-only tanpa error.
py-modules = []
